<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Navbar</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="m-0 min-h-screen bg-[#f5f5f5]">

  <nav
    class="
      absolute
      left-[80px]
      top-0
      box-border
      flex
      h-[85px]
      w-[1280px]
      flex-row
      items-center
      justify-start
      gap-0
      rounded-none
      bg-white
      opacity-100
    "
  >
    <!-- Logo -->
    <a
      href="#"
      class="flex shrink-0 items-center gap-[14px]"
    >
      <!-- Logo tạm -->
      <div
        class="
          flex
          h-[33px]
          w-[30px]
          items-center
          justify-center
          rounded-[8px]
          bg-[#7E3AF2]
          text-[14px]
          font-bold
          text-white
        "
      >
        L
      </div>

      <span
        class="
          whitespace-nowrap
          text-[24px]
          font-semibold
          leading-none
          text-[#111928]
        "
      >
        Landwind
      </span>
    </a>

    <!-- Menu -->
    <div
      class="
        ml-[35px]
        flex
        items-center
        gap-[32px]
      "
    >
      <a
        href="#"
        class="
          whitespace-nowrap
          text-[16px]
          font-normal
          text-[#111928]
          no-underline
        "
      >
        Company
      </a>

      <a
        href="#"
        class="
          whitespace-nowrap
          text-[16px]
          font-normal
          text-[#111928]
          no-underline
        "
      >
        Marketplace
      </a>

      <a
        href="#"
        class="
          whitespace-nowrap
          text-[16px]
          font-normal
          text-[#111928]
          no-underline
        "
      >
        Features
      </a>

      <a
        href="#"
        class="
          whitespace-nowrap
          text-[16px]
          font-normal
          text-[#111928]
          no-underline
        "
      >
        Team
      </a>

      <a
        href="#"
        class="
          whitespace-nowrap
          text-[16px]
          font-normal
          text-[#111928]
          no-underline
        "
      >
        Contact
      </a>
    </div>

    <!-- Khu vực bên phải -->
    <div
      class="
        ml-auto
        flex
        items-center
        gap-[16px]
      "
    >
      <a
        href="#"
        class="
          whitespace-nowrap
          text-[14px]
          font-medium
          text-[#111928]
          no-underline
        "
      >
        Log In
      </a>

      <a
        href="#"
        class="
          flex
          h-[37px]
          w-[101px]
          items-center
          justify-center
          whitespace-nowrap
          rounded-[8px]
          bg-[#7E3AF2]
          text-[14px]
          font-medium
          text-white
          no-underline
        "
      >
        Get started
      </a>
    </div>
  </nav>

</body>
</html>
